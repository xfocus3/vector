name: Verify service arguments on Windows

on:
  push:
    branches:
      - verify/windows-service-arguments-20261029

permissions:
  contents: read

jobs:
  service-arguments:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RELEASE_BUILDER: "true"
    steps:
      - name: Check out exact contribution revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 6acaaef6b33b38520c2a7f0fe8c9a42d59b295c2
          persist-credentials: false
      - name: Record source revision
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          git diff --exit-code
      - name: Prepare repository Windows toolchain
        run: .\scripts\environment\bootstrap-windows-2025.ps1
      - name: Test service argument construction
        run: |
          cargo test --locked --no-default-features --features sources-demo_logs,sinks-blackhole --lib service_arguments::tests:: -- --test-threads=1
      - name: Test Windows service input validation
        run: |
          cargo test --locked --no-default-features --features sources-demo_logs,sinks-blackhole --lib service::tests:: -- --test-threads=1
      - name: Verify source remained unchanged
        if: always()
        run: git diff --exit-code
